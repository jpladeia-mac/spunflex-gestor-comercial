name: GitHub Pages deployment blocked

on:
  workflow_dispatch:

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Explain blocked deployment
        run: |
          echo "Deploy bloqueado por segurança."
          echo "Este painel contém dados comerciais sensíveis e precisa de autenticação no host antes de servir arquivos estáticos."
          echo "GitHub Pages não aplica a barreira Basic-Auth/_headers necessária para este projeto."
          echo "Use Netlify com a variável SPUNFLEX_BASIC_AUTH configurada."
          exit 1
